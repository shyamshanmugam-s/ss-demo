<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="studio-spot" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#141c28" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#090d14" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#040608" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="cyan-rim-glow" cx="65%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#00f2fe" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Materials -->
    <linearGradient id="titanium-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="25%" stop-color="#1a202c"/>
      <stop offset="50%" stop-color="#4a5568"/>
      <stop offset="75%" stop-color="#171923"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>

    <linearGradient id="brushed-chrome" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="20%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#64748b"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="85%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="volute-dark" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="cyan-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>

    <linearGradient id="pedestal-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#111722"/>
      <stop offset="100%" stop-color="#070a0e"/>
    </linearGradient>

    <!-- Studio Floor Reflection Filter -->
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Isometric Technical Grid Pattern -->
    <pattern id="cad-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.03"/>
      <circle cx="0" cy="0" r="1" fill="#00f2fe" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Base Studio Canvas -->
  <rect width="1920" height="1080" fill="#040608"/>
  <rect width="1920" height="1080" fill="url(#studio-spot)"/>
  <rect width="1920" height="1080" fill="url(#cad-grid)"/>

  <!-- Subtle Cyan Ambient Light Cone -->
  <ellipse cx="1180" cy="480" rx="600" ry="420" fill="url(#cyan-rim-glow)"/>

  <!-- Ground Studio Pedestal & Contact Shadow -->
  <g opacity="0.95">
    <ellipse cx="960" cy="790" rx="620" ry="75" fill="#010204" opacity="0.8" filter="url(#glow-blur)"/>
    <ellipse cx="960" cy="780" rx="560" ry="55" fill="url(#pedestal-grad)" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1"/>
    <line x1="400" y1="780" x2="1520" y2="780" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.25"/>
  </g>

  <!-- Technical Engineering Grid Axis Lines & Coordinate Ticks -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.75" stroke-dasharray="4,6">
    <line x1="960" y1="120" x2="960" y2="920"/>
    <line x1="280" y1="520" x2="1640" y2="520"/>
    <line x1="620" y1="260" x2="1300" y2="780"/>
  </g>

  <!-- Background Technical Blueprint Geometry & Concentric Calibration Rings -->
  <g stroke="#00f2fe" stroke-opacity="0.12" stroke-width="1" fill="none">
    <circle cx="960" cy="500" r="380" stroke-dasharray="2,8"/>
    <circle cx="960" cy="500" r="280"/>
    <circle cx="960" cy="500" r="160" stroke-dasharray="6,6"/>
    <circle cx="680" cy="510" r="190" stroke-opacity="0.08"/>
    <circle cx="1200" cy="460" r="220" stroke-opacity="0.08"/>
  </g>

  <!-- PRIMARY INDUSTRIAL PUMP ASSEMBLY (Machined 3D Volute, Motor & Flange Assembly) -->
  <g id="pump-assembly" transform="translate(40, -10)">

    <!-- 1. Electric Motor Housing & Longitudinal Cooling Fins -->
    <g id="motor-casing">
      <!-- Motor Base Mounting Foot -->
      <path d="M 980 660 L 1380 660 L 1400 710 L 960 710 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <circle cx="1020" cy="685" r="7" fill="#000000" stroke="#64748b" stroke-width="1"/>
      <circle cx="1340" cy="685" r="7" fill="#000000" stroke="#64748b" stroke-width="1"/>

      <!-- Motor Main Cylindrical Body -->
      <rect x="1000" y="340" width="360" height="320" rx="20" fill="url(#volute-dark)" stroke="#334155" stroke-width="2"/>
      <rect x="1000" y="340" width="360" height="320" rx="20" fill="url(#titanium-body)" opacity="0.6"/>

      <!-- Longitudinal Cooling Fins (Precision Machined Ribs) -->
      <g stroke="#475569" stroke-width="2" opacity="0.8">
        <line x1="1020" y1="365" x2="1340" y2="365"/>
        <line x1="1020" y1="395" x2="1340" y2="395"/>
        <line x1="1020" y1="425" x2="1340" y2="425"/>
        <line x1="1020" y1="455" x2="1340" y2="455"/>
        <line x1="1020" y1="485" x2="1340" y2="485"/>
        <line x1="1020" y1="515" x2="1340" y2="515"/>
        <line x1="1020" y1="545" x2="1340" y2="545"/>
        <line x1="1020" y1="575" x2="1340" y2="575"/>
        <line x1="1020" y1="605" x2="1340" y2="605"/>
        <line x1="1020" y1="635" x2="1340" y2="635"/>
      </g>

      <!-- Rear Fan Cowl / End Shield -->
      <path d="M 1360 350 C 1410 350 1440 390 1440 500 C 1440 610 1410 650 1360 650 Z" fill="#0b111c" stroke="#334155" stroke-width="2"/>
      <ellipse cx="1400" cy="500" rx="15" ry="60" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.4"/>

      <!-- Top Conduit Terminal Junction Box -->
      <rect x="1100" y="270" width="160" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
      <rect x="1115" y="282" width="130" height="50" rx="4" fill="#0f172a" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.3"/>
      <!-- Terminal cable entry glands -->
      <circle cx="1235" cy="307" r="10" fill="#334155" stroke="#64748b" stroke-width="1"/>
    </g>

    <!-- 2. Intermediate Bearing Housing / Shaft Coupling Lantern -->
    <g id="bearing-housing">
      <path d="M 880 390 L 1000 360 L 1000 640 L 880 610 Z" fill="url(#titanium-body)" stroke="#475569" stroke-width="2"/>
      <ellipse cx="940" cy="500" rx="20" ry="85" fill="#0a0f18" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.4"/>
      <!-- Inspection aperture cutaway -->
      <rect x="915" y="460" width="50" height="80" rx="6" fill="#020617" stroke="#334155" stroke-width="1"/>
      <line x1="940" y1="440" x2="940" y2="560" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- 3. Heavy Industrial Volute Spiral Pump Casing (Centrifugal Impeller Chamber) -->
    <g id="pump-volute">
      <!-- Outer Volute Spiral Body -->
      <path d="M 880 500 C 880 340 760 250 620 250 C 460 250 340 370 340 520 C 340 680 460 760 640 760 C 780 760 880 670 880 500 Z" 
            fill="url(#volute-dark)" stroke="#475569" stroke-width="3"/>
      <path d="M 860 500 C 860 360 750 270 620 270 C 480 270 365 380 365 520 C 365 660 480 740 630 740 C 760 740 860 650 860 500 Z" 
            fill="url(#titanium-body)" opacity="0.85"/>

      <!-- Volute Radial Stiffening Ribs -->
      <path d="M 620 270 L 620 400 M 365 520 L 490 520 M 630 740 L 630 610 M 800 370 L 710 450 M 460 670 L 540 590" 
            stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

      <!-- Volute Flange Perimeter Bolts -->
      <g fill="#94a3b8" stroke="#0f172a" stroke-width="1">
        <circle cx="620" cy="290" r="7"/>
        <circle cx="730" cy="325" r="7"/>
        <circle cx="810" cy="400" r="7"/>
        <circle cx="840" cy="500" r="7"/>
        <circle cx="810" cy="600" r="7"/>
        <circle cx="730" cy="680" r="7"/>
        <circle cx="630" cy="715" r="7"/>
        <circle cx="510" cy="690" r="7"/>
        <circle cx="420" cy="620" r="7"/>
        <circle cx="385" cy="515" r="7"/>
        <circle cx="420" cy="410" r="7"/>
        <circle cx="510" cy="335" r="7"/>
      </g>

      <!-- Center Axial Suction Intake Bellmouth & Flange -->
      <circle cx="610" cy="510" r="120" fill="url(#volute-dark)" stroke="#334155" stroke-width="2"/>
      <circle cx="610" cy="510" r="95" fill="url(#brushed-chrome)" stroke="#64748b" stroke-width="3"/>
      <circle cx="610" cy="510" r="70" fill="#020617" stroke="#00f2fe" stroke-width="2"/>

      <!-- 6-Vane Precision Impeller Geometry (Inside Suction Eye) -->
      <g stroke="#00f2fe" stroke-width="2" stroke-opacity="0.8" fill="none">
        <path d="M 610 510 Q 640 470 660 450"/>
        <path d="M 610 510 Q 660 520 680 535"/>
        <path d="M 610 510 Q 630 550 635 575"/>
        <path d="M 610 510 Q 580 550 560 570"/>
        <path d="M 610 510 Q 560 500 540 485"/>
        <path d="M 610 510 Q 590 470 585 445"/>
        <circle cx="610" cy="510" r="14" fill="#00f2fe" fill-opacity="0.3" stroke="#ffffff" stroke-width="1.5"/>
      </g>
    </g>

    <!-- 4. Top Vertical Discharge Nozzle & Bolted Flange -->
    <g id="discharge-nozzle">
      <path d="M 540 270 L 540 150 L 700 150 L 700 270 Z" fill="url(#volute-dark)" stroke="#475569" stroke-width="2"/>
      <!-- Top Heavy Machined Flange -->
      <rect x="510" y="110" width="220" height="40" rx="6" fill="url(#brushed-chrome)" stroke="#334155" stroke-width="2"/>
      <!-- Flange Bolt Holes -->
      <circle cx="535" cy="130" r="6" fill="#020617" stroke="#64748b" stroke-width="1"/>
      <circle cx="585" cy="130" r="6" fill="#020617" stroke="#64748b" stroke-width="1"/>
      <circle cx="655" cy="130" r="6" fill="#020617" stroke="#64748b" stroke-width="1"/>
      <circle cx="705" cy="130" r="6" fill="#020617" stroke="#64748b" stroke-width="1"/>

      <!-- Pressure Sensor Transducer Port -->
      <rect x="675" y="170" width="30" height="18" fill="#334155" stroke="#00f2fe" stroke-width="1"/>
      <circle cx="715" cy="179" r="12" fill="#0a0f18" stroke="#00f2fe" stroke-width="1.5"/>
      <circle cx="715" cy="179" r="8" fill="#00f2fe" fill-opacity="0.2"/>
    </g>

    <!-- 5. Front Axial Suction Pipe Inlet Flange (Facing Viewer) -->
    <g id="suction-flange">
      <ellipse cx="610" cy="510" rx="95" ry="95" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="10,5"/>
    </g>
  </g>

  <!-- DYNAMIC FLUID STREAMLINE VECTOR CHOREOGRAPHY (Electric Cyan / Technical Flow) -->
  <g stroke="url(#cyan-accent-grad)" stroke-width="2" fill="none" opacity="0.85">
    <!-- Intake streamline path -->
    <path d="M 180 500 C 320 500 480 500 650 500" stroke-dasharray="8,6"/>
    <path d="M 220 470 C 350 470 490 480 650 500" stroke-dasharray="6,8" stroke-width="1.5"/>
    <path d="M 220 530 C 350 530 490 520 650 500" stroke-dasharray="6,8" stroke-width="1.5"/>

    <!-- Discharge streamline path -->
    <path d="M 660 260 C 660 200 660 140 660 40" stroke-dasharray="8,6" stroke-width="2.5"/>
    <path d="M 630 260 C 630 200 630 140 630 40" stroke-dasharray="6,6" stroke-width="1.5"/>
    <path d="M 690 260 C 690 200 690 140 690 40" stroke-dasharray="6,6" stroke-width="1.5"/>
  </g>

  <!-- Precision Technical Overlay & Dimension Annotations -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" letter-spacing="1">
    <!-- Top Left Metric Callout -->
    <g transform="translate(80, 100)">
      <rect x="0" y="0" width="260" height="70" rx="8" fill="#080c14" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
      <text x="16" y="26" font-weight="bold" fill="#00f2fe" font-size="10">HYDRAULIC GEOMETRY MODEL</text>
      <text x="16" y="44" fill="#cbd5e1" font-size="12">CENTRIFUGAL VOLUTE</text>
      <text x="16" y="58" font-size="9" fill="#64748b">STAGE: 01 · INDUSTRIAL PUMPING</text>
    </g>

    <!-- Center Top Discharge Vector Callout -->
    <g transform="translate(760, 60)">
      <line x1="-30" y1="20" x2="-5" y2="20" stroke="#00f2fe" stroke-width="1.5"/>
      <text x="0" y="16" fill="#00f2fe" font-size="10" font-weight="bold">DISCHARGE DELIVERY VECTOR</text>
      <text x="0" y="32" font-size="9" fill="#64748b">FLOW PATH / REPRESENTATIVE</text>
    </g>

    <!-- Bottom Right Engineering Envelope Specification -->
    <g transform="translate(1540, 880)">
      <rect x="-180" y="-30" width="220" height="65" rx="8" fill="#080c14" stroke="#00f2fe" stroke-opacity="0.2" stroke-width="1"/>
      <text x="-164" y="-8" font-weight="bold" fill="#f8fafc" font-size="11">ENGINEERING CAD SPEC</text>
      <text x="-164" y="10" font-size="9" fill="#00f2fe">ENGINEERING STUDY</text>
      <text x="-164" y="24" font-size="8" fill="#64748b">REPRESENTATIVE DEMO ARTWORK</text>
    </g>

    <!-- Suction Intake Annotation -->
    <g transform="translate(160, 580)">
      <line x1="80" y1="-80" x2="160" y2="-80" stroke="#00f2fe" stroke-width="1" stroke-dasharray="2,4"/>
      <text x="0" y="-76" fill="#00f2fe" font-size="10" font-weight="bold">SUCTION EYE INTAKE</text>
      <text x="0" y="-60" font-size="9" fill="#64748b">AXIAL FLUID ENTRY CHANNEL</text>
    </g>
  </g>

  <!-- Editorial Framing Border & Subtle Corner Accents -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <line x1="40" y1="40" x2="100" y2="40"/>
    <line x1="40" y1="40" x2="40" y2="100"/>
    <line x1="1880" y1="40" x2="1820" y2="40"/>
    <line x1="1880" y1="40" x2="1880" y2="100"/>
    <line x1="40" y1="1040" x2="100" y2="1040"/>
    <line x1="40" y1="1040" x2="40" y2="980"/>
    <line x1="1880" y1="1040" x2="1820" y2="1040"/>
    <line x1="1880" y1="1040" x2="1880" y2="980"/>
  </g>
</svg>
